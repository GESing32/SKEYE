[pytest]
# =============================================================================
# pytest Configuration for SKEYE Flight System
# =============================================================================

# Test Discovery
# -----------------------------------------------------------------------------
testpaths = test/unit test/integration
python_files = pytest_test_*.py test_*.py
python_classes = Test*
python_functions = test_*

# Test Markers
# -----------------------------------------------------------------------------
# Define custom markers for categorizing tests
# Usage: @pytest.mark.unit, @pytest.mark.slow, etc.
markers =
    unit: Fast unit tests (< 1s per test)
    integration: Integration tests (may be slower)
    slow: Slow tests (skip with -m "not slow")
    mavlink: Tests requiring MAVLink hardware or mocks
    geometry: Geodetic calculation and coordinate transformation tests
    survey: Survey planning and mission generation tests
    gcs: Ground control station core functionality tests

# Default Command-Line Options
# -----------------------------------------------------------------------------
addopts =
    # Verbosity and output
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --showlocals

    # Coverage reporting (requires pytest-cov)
    # Uncomment after installing: pip install pytest-cov
    # --cov=src/flight-system/v2
    # --cov-report=term-missing:skip-covered
    # --cov-report=html
    # --cov-fail-under=80

    # Warnings
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

# Test Output
# -----------------------------------------------------------------------------
console_output_style = progress
junit_family = xunit2

# Timeouts (requires pytest-timeout plugin)
# -----------------------------------------------------------------------------
# Uncomment after installing: pip install pytest-timeout
# timeout = 300
# timeout_method = thread

# Fixtures
# -----------------------------------------------------------------------------
# Fixture scope for better test isolation
usefixtures =

# Logging
# -----------------------------------------------------------------------------
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = test/test_logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Python Path
# -----------------------------------------------------------------------------
# Ensure src directory is in Python path
pythonpath = src/flight-system/v2

# Minimum Python Version
# -----------------------------------------------------------------------------
minversion = 3.8

# =============================================================================
# Usage Examples
# =============================================================================
#
# Run all tests:
#   pytest
#
# Run with verbose output:
#   pytest -v
#
# Run only unit tests:
#   pytest -m unit
#
# Run all tests except slow ones:
#   pytest -m "not slow"
#
# Run only geometry tests:
#   pytest -m geometry
#
# Run tests in parallel (requires pytest-xdist):
#   pytest -n auto
#
# Run with coverage:
#   pytest --cov=src/flight-system/v2 --cov-report=html
#
# Run specific file:
#   pytest test/unit/pytest_test_geometry_utils.py
#
# Run specific test:
#   pytest test/unit/pytest_test_geometry_utils.py::test_haversine_distance_known_points
#
# Run tests matching pattern:
#   pytest -k "haversine"
#
# Run last failed tests:
#   pytest --lf
#
# Stop on first failure:
#   pytest -x
#
# Generate HTML report (requires pytest-html):
#   pytest --html=report.html --self-contained-html
#
# =============================================================================
